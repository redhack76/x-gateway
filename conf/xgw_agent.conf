# ============================================================
# xgw_agent.conf  (key = value, '#' 주석)
# ============================================================

# --- 연동 서버 (보안 로그 수집 Agent) ---
server_ip           = 183.99.77.198
server_port         = 50010

# --- 연결 / 재연결 (지수 백오프) ---
connect_timeout_ms  = 5000
reconnect_min_ms    = 1000
reconnect_max_ms    = 30000

# --- ACK / 재전송 (정의서 6장) ---
wait_ack            = 1        # 1: ACK 대기 후 큐 삭제, 0: 송신 즉시 삭제
ack_timeout_ms      = 3000
max_retry           = 3        # 초과 시 연결을 끊고 재연결 후 재전송
window              = 32       # ACK 대기 중 동시 전송 가능 메시지 수 (1~256)

# --- 프레이밍 (정의서 미확정 → 쿤텍과 확정 후 변경) ---
#   newline : JSON 1건 + '\n'  /  length : 4byte BE 길이 헤더 + JSON  /  none
framing             = newline

# --- TCP keepalive (정의서 2.4: 지속연결) ---
keepalive_idle      = 30
keepalive_intvl     = 10
keepalive_cnt       = 3

# --- Header 값 ---
schema_version      = 1.0
ap_id               = auto     # auto: ap_id_iface 의 MAC 주소 사용 (또는 직접 지정)
ap_id_iface         = br-lan

# --- 패킷 캡처 ---
interface           = br-lan
snaplen             = 256      # raw_data 최대 바이트 (초과분 절단, length는 절단 후 길이)
promisc             = 0
include_outgoing    = 0        # 0: 수신 방향만 (bridge 중복 방지)
station_id_mode     = src      # src: 출발지 MAC / dst: 목적지 MAC
max_pps             = 500      # 초당 최대 생성 메시지 수 (0 = 무제한)

# 캡처 대상: all | arp | eapol | dhcp | dns | icmp | icmp6 | tcp_port:N | udp_port:N
filter              = arp,eapol,dhcp,dns,icmp

# --- 큐 / 운영 ---
queue_max           = 2000     # 미전송 메시지 최대 건수 (가득 차면 오래된 것부터 폐기)
stats_interval_sec  = 60
daemon              = 1
pidfile             = /var/run/xgw_agent.pid
log_file            =          # 비우면 daemon: syslog, foreground: stderr
log_level           = 1        # 0 ERR / 1 INFO / 2 DEBUG
