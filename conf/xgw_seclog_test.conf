# ============================================================
# xgw_seclog_test.conf
# X-Gateway 보안로그 전송 테스트 설정 (key = value, '#' 주석)
# ============================================================

# --- 연동 서버 (보안 로그 수집 Agent) ---
server_ip           = 183.99.77.198
server_port         = 50010

# --- 연결/재전송 ---
connect_timeout_ms  = 5000
wait_ack            = 1        # 1: ACK 대기, 0: 송신만
ack_timeout_ms      = 3000
max_retry           = 3        # ACK 미수신 시 동일 message_id로 재전송

# --- 전송 제어 ---
send_count          = 1        # 0 = 무한 (Ctrl+C 종료)
send_interval_ms    = 1000

# --- 프레이밍 (정의서 미확정 -> 상대측과 확정 후 변경) ---
#   newline : JSON 1건 + '\n'  (JSON Lines)
#   length  : 4byte big-endian 길이 헤더 + JSON
#   none    : JSON만 전송
framing             = newline

# --- TCP keepalive (정의서 2.4: 지속연결) ---
keepalive_idle      = 30
keepalive_intvl     = 10
keepalive_cnt       = 3

# --- Header / Payload 값 ---
schema_version      = 1.0
ap_id               = 38:F4:5E:11:22:33
interface           = br-lan
station_id          = 8C:AA:BB:CC:DD:EE

# 원본 패킷 HEX 문자열 (length는 자동 계산). 아래는 ARP 샘플 42 bytes
raw_data            = FFFFFFFFFFFF8CAABBCCDDEE080600010800060400018CAABBCCDDEEC0000215000000000000C0000201
